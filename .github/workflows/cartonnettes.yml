name: Cartonnettes du mois

on:
  schedule:
    - cron: "0 6 1 * *"     # le 1er de chaque mois à 06:00 UTC
  workflow_dispatch: {}       # + bouton "Run workflow" pour relancer à la demande

permissions:
  contents: write

jobs:
  generer:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install pymupdf pillow numpy

      - name: Générer le PDF (A4 portrait, nom fixe)
        run: python cartonnettes_a4.py --orientation portrait --sortie Cartonnettes-A4-portrait.pdf

      - name: Vérifier que le PDF a bien été créé
        run: test -f Cartonnettes-A4-portrait.pdf

      - name: Publier à l'adresse fixe (release "latest")
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Cartonnettes du mois
          body: "PDF des cartonnettes Nifty du mois, mis à jour automatiquement."
          files: Cartonnettes-A4-portrait.pdf

      - name: Envoyer le PDF par e-mail
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Cartonnettes Nifty <${{ secrets.MAIL_USERNAME }}>
          to: ${{ secrets.MAIL_TO }}
          subject: "Cartonnettes Nifty — PDF du mois"
          body: |
            Bonjour,

            Voici le PDF des cartonnettes Nifty du mois, en pièce jointe.

            Lien permanent (toujours à jour) :
            https://github.com/95ordo-star/cartonnettes-nifty/releases/download/latest/Cartonnettes-A4-portrait.pdf

            — Envoi automatique
          attachments: Cartonnettes-A4-portrait.pdf
